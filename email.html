  <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #1f2328; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="dark"] body { background: #15171a; color: #e6e6e6; }
    :root[data-theme="dark"] a { color: #8fb0f2; }
    main { text-align: center; padding: 2rem; }
    p { margin: 0 0 1.5rem; font-size: 1.3rem; letter-spacing: .02em; }
    a { color: #3764be; text-decoration: none; font-size: .95rem; }
    a:hover { color: #cb5920; }
  </style>
</head>
